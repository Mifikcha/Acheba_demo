# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Hopes and Dreams
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ru-RU
  baseUrl: mifikcha.github.io/Acheba_demo
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title:
        name: Libertinus Serif
        weights:
          - 400
          - 700
      header:
        name: Libertinus Serif
        weights:
          - 400
          - 700
      body:
        name: Libertinus Serif
        weights:
          - 400
          - 600
        includeItalic: true
      code:
        name: JetBrains Mono
        weights:
          - 400
          - 600
    colors:
      lightMode:
        light: "#f2edd8"
        lightgray: "#ece1c6"
        gray: "#6c625a"
        darkgray: "#514a45"
        dark: "#2f2b29"
        secondary: "#a46f22"
        tertiary: "#477b7d"
        highlight: rgba(164, 111, 34, 0.15)
        textHighlight: rgba(164, 111, 34, 0.24)
      darkMode:
        light: "#1a1b26"
        lightgray: "#292e42"
        gray: "#565f89"
        darkgray: "#a9b1d6"
        dark: "#c0caf5"
        secondary: "#bb9af7"
        tertiary: "#7dcfff"
        highlight: rgba(122, 162, 247, 0.18)
        textHighlight: rgba(187, 154, 247, 0.34)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      minEntries: 2
      showByDefault: true
      collapseByDefault: false
    order: 50
    layout:
      position: right
      priority: 60
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      title:
        name: Libertinus Serif
        weights:
          - 400
          - 700
      header:
        name: Libertinus Serif
        weights:
          - 400
          - 700
      body:
        name: Libertinus Serif
        weights:
          - 400
          - 600
        includeItalic: true
      code:
        name: JetBrains Mono
        weights:
          - 400
          - 600
      interface:
        name: Libertinus Serif
        weights:
          - 400
          - 600
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderDefaultState: closed
      folderClickBehavior: collapse
      useSavedState: false
      sortFn: |
        (a, b) => {
          const isStudentStats = (node) =>
            node.slugSegments?.length === 1 &&
            (node.slugSegment === "статистика-учеников" || node.displayName === "Статистика учеников")

          if (a.isFolder && b.isFolder) {
            if (isStudentStats(a) && !isStudentStats(b)) return 1
            if (!isStudentStats(a) && isStudentStats(b)) return -1
          }

          if ((!a.isFolder && !b.isFolder) || (a.isFolder && b.isFolder)) {
            return (a.displayName || "").localeCompare(b.displayName || "", undefined, {
              numeric: true,
              sensitivity: "base",
            })
          }

          if (!a.isFolder && b.isFolder) return 1
          return -1
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 0.82
        repelForce: 0.95
        centerForce: 0.18
        linkDistance: 64
        linkStrength: 0.8
        nodeScale: 0.48
        lineWidth: 0.28
        fontSize: 0.24
        opacityScale: 1.15
        removeTags:
          - публичный-сайт
        showTags: true
        focusOnHover: false
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.78
        repelForce: 1.35
        centerForce: 0.1
        linkDistance: 118
        linkStrength: 0.72
        nodeScale: 0.5
        lineWidth: 0.25
        fontSize: 0.22
        opacityScale: 1.2
        removeTags:
          - публичный-сайт
        showTags: true
        focusOnHover: true
        enableRadial: false
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Telegram: https://t.me/Skifcha
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude: []
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
