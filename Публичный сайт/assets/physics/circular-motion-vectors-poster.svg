<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="title desc">
  <title id="title">Скорость и ускорения при движении по окружности</title>
  <desc id="desc">Скорость направлена по касательной, нормальное ускорение — к центру, а полное ускорение равно сумме нормального и тангенциального.</desc>
  <defs>
    <marker id="cyan-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#7dcfff"/></marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#bb9af7"/></marker>
    <marker id="gold-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#e0af68"/></marker>
    <marker id="rose-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#f7768e"/></marker>
  </defs>
  <rect width="500" height="360" fill="#1a1b26"/>
  <circle cx="250" cy="200" r="135" fill="none" stroke="#565f89" stroke-width="3"/>
  <line x1="250" y1="200" x2="345" y2="105" stroke="#565f89" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="250" cy="200" r="4" fill="#8b94b8"/>
  <circle cx="345" cy="105" r="8" fill="#e0e6ff" stroke="#1a1b26" stroke-width="3"/>

  <line x1="275" y1="175" x2="237" y2="137" stroke="#565f89" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="307" y1="67" x2="237" y2="137" stroke="#565f89" stroke-width="2" stroke-dasharray="6 6"/>

  <line x1="345" y1="105" x2="270" y2="30" stroke="#7dcfff" stroke-width="5" marker-end="url(#cyan-arrow)"/>
  <line x1="345" y1="105" x2="275" y2="175" stroke="#bb9af7" stroke-width="5" marker-end="url(#purple-arrow)"/>
  <line x1="345" y1="105" x2="307" y2="67" stroke="#e0af68" stroke-width="5" marker-end="url(#gold-arrow)"/>
  <line x1="345" y1="105" x2="237" y2="137" stroke="#f7768e" stroke-width="6" marker-end="url(#rose-arrow)"/>

  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700">
    <text x="270" y="25" fill="#7dcfff">v</text>
    <text x="278" y="189" fill="#bb9af7">aₙ</text>
    <text x="312" y="58" fill="#e0af68">aτ</text>
    <text x="215" y="128" fill="#f7768e">a</text>
  </g>
  <text x="250" y="334" text-anchor="middle" fill="#c0caf5" font-family="system-ui, sans-serif" font-size="22">a = aₙ + aτ</text>
</svg>
